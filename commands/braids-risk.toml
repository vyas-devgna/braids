description = "Adversarial pre-mortem: assume it shipped and caused an incident"
prompt = "Use the braids-risk skill. Assume this design or change shipped and caused an incident, then work backwards to the cause. Interrogate only the failure modes this case can actually reach: weakest assumption, missed caller or consumer, partial failure, retry and idempotency, concurrency, upgrade and downgrade, scale, corrupt stored state, dependency outage, and the cheapest attack path. Answer each from the code, not in general. Rank surviving failures by consequence times reachability with detectability and recoverability noted, and say which you would fix before shipping versus accept and monitor. Discard failures the system cannot reach."
