description = "Build the claim ledger — every claim mapped to its evidence"
prompt = "Use the braids-claims skill. Collect every material claim in scope from the diff, commit messages, PR description, release notes, README and the conversation, watching for faster, optimized, secure, hardened, reliable, robust, scalable, compatible, production-ready, fixes the race, and handles failure. Map each to the evidence that would settle it and status it supported, unverified, contradicted, or not-applicable. Remember that passing tests support only the behaviour those tests exercise, and that missing infrastructure leaves a claim unverified rather than true. Report one row per claim with what the evidence does not cover, then say which claims must be removed or softened before shipping and the cheapest experiment that would upgrade the most valuable unverified one."
