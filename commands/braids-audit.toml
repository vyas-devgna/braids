description = "Rank where the engineering risk actually is across the whole repo"
prompt = "Use the braids-audit skill. This is a read-only whole-repository survey, not a diff review, and not a repair job. Bound the survey from entry points, trust boundaries, persistent state and the deploy surface, and say what you did not read. Rank findings by consequence times exposure, tie-broken by poor detectability and recoverability, never by file size. Cover trust boundaries, data integrity, failure and recovery, concurrency, compatibility, dependency burden, cost without value, and unproven claims in docs. Lead with the three things most worth fixing first, then one ranked line per finding, and close with what you could not determine without running the system."
