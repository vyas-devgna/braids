description = "Set implementation threshold (low/high/ultra) or explain depth routing"
prompt = "Use the braids-depth skill. If the user named a threshold, apply it: low means the smallest change that works with the obvious check; high means production shape with failure paths, affected callers and regression tests; ultra means the hostile cases too, with migration and rollback and evidence for every claim. Honour low without lecturing, except where the change would weaken security, authorization, privacy, data integrity, a destructive or irreversible operation, or a compatibility guarantee — there, name in one sentence what low would skip and do the smallest safe version. Threshold caps effort; risk sets the floor on care; neither changes what may be claimed. If instead the user asked why a task got its depth, name the deciding factors and which dominated."
