description = "Engineering review of the current diff, branch, or a pull request"
prompt = "Use the braids-review skill. Establish the actual diff first and stop if there is none. Report correctness bugs, missed callers and surface, failure and recovery gaps, concurrency hazards, trust-boundary weakening, compatibility breaks, cost that buys nothing, and claims asserted without evidence. Lead with merge / merge-with-fixes / do-not-merge, then one line per finding, most damaging first: <severity> <file>:<line> — <what is wrong>. <what happens>. <smallest fix>. Say which findings you verified and which you inferred, and end with the residual risk of merging. If the change is sound, say so without inventing findings."
