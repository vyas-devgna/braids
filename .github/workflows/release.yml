name: release

# Publishes on a version tag. Every gate must pass first: a release that skips
# validation is exactly the unevidenced claim Braids exists to prevent.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Create isolated validation environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Gate the release
        run: |
          python3 scripts/validate.py
          python3 scripts/build_adapters.py --dist dist
          python3 scripts/run_evals.py --fixture-tests
          python3 scripts/measure_budget.py
          python3 -m unittest discover -s tests
          .ci-venv/bin/check-jsonschema --check-metaschema schemas/*.json
          .ci-venv/bin/check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json plugin.json
          .ci-venv/bin/check-jsonschema --schemafile schemas/adapter.schema.json adapters/*/adapter.json
          .ci-venv/bin/check-jsonschema --schemafile schemas/host-capabilities.schema.json adapters/*/capabilities.json
          PATH="$PWD/.ci-venv/bin:$PATH" python3 scripts/run_evals.py --full-schema
          for skill in skills/*; do
            test -f "$skill/SKILL.md" || continue
            .ci-venv/bin/agentskills validate "$skill"
          done
          for skill in dist/claude-code/skills/*; do
            test -f "$skill/SKILL.md" || continue
            .ci-venv/bin/agentskills validate "$skill"
          done
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          npm=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || { echo "tag $tag != plugin.json $pkg"; exit 1; }
          test "$tag" = "$npm" || { echo "tag $tag != package.json $npm"; exit 1; }

  npm:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Select npm dist-tag
        id: dist_tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "name=next" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        # npm uses OIDC first, then the bootstrap token for the first publish,
        # before this package can have a trusted publisher configured.
        run: npm publish --provenance --access public --tag "${{ steps.dist_tag.outputs.name }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
